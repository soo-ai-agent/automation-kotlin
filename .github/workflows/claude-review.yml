# 🔒 기능 본체 — 여기에 사용자 설정은 없어요. 고칠 곳: 통과 기준·재수정 횟수는
#    .github/agent/settings.env, 리뷰 규칙은 common/docs/code-review/rules.md.
#    이 파일은 기능 자체를 개조할 때만 열고, 수정 전에 common/docs/automation-spec.md 를 먼저 읽어요.
#
# Claude 리뷰어 — PR diff 를 판정하고 코멘트를 남겨요. 코드는 고치지 않아요(재작업 루프 방지).
#
# 잡 흐름 (step 순서 그대로):
#   설정 로드 → diff 추출 → 리뷰 규칙 모으기 → Claude 판정 → PR 에 코멘트
#   → PASS 면 에이전트가 쪼갠 하위 이슈(claude-made)의 PR 만 자동 머지,
#     사람이 올린 이슈의 PR 은 사람이 머지 / 지적이면 fix 노드 재호출,
#     리뷰 코멘트가 CLAUDE_MAX_ROUNDS 개면 멈추고 사람을 불러요
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT || github.token }}
      HAS_PAT: ${{ secrets.AGENT_PAT != '' }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      MARKER: "🔍 Claude 코드 리뷰" # 코멘트 제목 겸 라운드 카운터 — 같은 문자열이어야 해요
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 타겟 브랜치와 비교하려면 이력이 필요해요
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 설정 로드와 도구 준비
        run: |
          set -e
          git fetch origin "$BASE_REF"
          # 설정·도구는 항상 기본 브랜치 것 — PR 브랜치가 리뷰 기준을 바꾸지 못하게
          git show "origin/$BASE_REF:.github/agent/settings.env" > /tmp/settings.env
          git show "origin/$BASE_REF:.github/agent/stream.js" > /tmp/stream.js
          # 리뷰어 역할 지시문 — 하네스(common/harness-tests/run.sh)도 같은 파일을 읽는다.
          # 여기 인라인으로 두면 하네스가 자기 프롬프트를 따로 쓰게 되고, 그러면 하네스가
          # 통과해도 실제 리뷰어의 회귀는 못 잡는다.
          git show "origin/$BASE_REF:.github/agent/review-role.md" > /tmp/review-role.md
          # 루프 판단(자동 머지 게이트 포함) — PR 브랜치가 자기 머지 조건을 바꾸지 못하게 기준 브랜치 것.
          # 하네스(common/harness-tests/loop.sh)도 같은 파일을 돌린다.
          git show "origin/$BASE_REF:.github/agent/loop-decision.sh" > /tmp/loop-decision.sh
          # 루프 상태의 단일 원본 — 노드도 리뷰어도 이 도구로만 상태를 읽고 쓴다
          git show "origin/$BASE_REF:.github/agent/state.sh" > /tmp/state.sh
          # 다음에 어느 역할을 부를지 정하는 규칙 — 이것도 기준 브랜치 것을 쓴다
          git show "origin/$BASE_REF:.github/agent/next-role.sh" > /tmp/next-role.sh
          . /tmp/settings.env
          {
            echo "MAX_ROUNDS=$CLAUDE_MAX_ROUNDS"
            echo "MAX_STEPS=$CLAUDE_MAX_STEPS"
            echo "RULES_DIR=$CLAUDE_REVIEW_RULES_DIR"
            echo "DIFF_LIMIT=$CLAUDE_DIFF_LIMIT_BYTES"
            echo 'REVIEW_BAR<<BAREOF'
            printf '%s\n' "$CLAUDE_REVIEW_BAR"
            echo 'BAREOF'
          } >> "$GITHUB_ENV"
          npm install -g @anthropic-ai/claude-code

      - name: diff 추출
        run: |
          set -e
          git diff "origin/$BASE_REF...HEAD" | head -c "$DIFF_LIMIT" > /tmp/diff.patch
          if [ ! -s /tmp/diff.patch ]; then
            echo "diff 없음 — 리뷰 생략"; echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: 라운드 확인
        if: env.SKIP != 'true'
        run: |
          # 라운드 수를 따로 저장하지 않고 자기 코멘트 개수로 센다 — PR 당 정확하고 저장소도 안 건드린다
          ROUNDS=$(gh pr view "$PR" --json comments \
            --jq "[.comments[] | select(.body | contains(\"$MARKER\"))] | length")
          echo "리뷰 라운드: $ROUNDS / $MAX_ROUNDS"
          echo "ROUNDS=$ROUNDS" >> "$GITHUB_ENV"

      - name: 기준 스펙 찾기
        if: env.SKIP != 'true'
        run: |
          # 이슈 본문의 specs/ 경로를 찾는다. 못 찾으면 스펙 대조 없이 기존 기준으로만 판정한다
          # (이슈 조회 실패가 리뷰를 죽이면 안 된다 — 안전 측 실패)
          SPEC_PATH=""
          case "$HEAD_REF" in
            claude/issue-*)
              N="${HEAD_REF#claude/issue-}"
              case "$N" in
                ''|*[!0-9]*) ;;
                *) SPEC_PATH=$(gh issue view "$N" --json body --jq '.body' 2>/dev/null                      | grep -oE 'specs/[A-Za-z0-9._/-]+' | head -n 1) || true ;;
              esac ;;
          esac
          if [ -n "$SPEC_PATH" ] && [ ! -f "$SPEC_PATH" ]; then
            SPEC_PATH="$(dirname "$SPEC_PATH")/spec.md"
          fi
          if [ -n "$SPEC_PATH" ] && [ -f "$SPEC_PATH" ]; then
            echo "SPEC_PATH=$SPEC_PATH" >> "$GITHUB_ENV"
            echo "기준 스펙: $SPEC_PATH"
          else
            echo "스펙 없음 — 기존 기준으로만 판정"
          fi

      - name: 리뷰
        if: env.SKIP != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          # 규칙과 diff 는 stdin 으로 — 프롬프트 문자열에 넣으면 md 의 백틱이 셸에서 실행된다
          {
            printf '## 리뷰 규칙\n\n'
            find "$RULES_DIR" -name '*.md' -type f -print0 2>/dev/null | sort -z | xargs -0 -r cat \
              || echo "(리뷰 규칙 문서 없음 — 통과 기준만 적용)"
            printf '\n\n## 통과 기준\n\n%s\n' "$REVIEW_BAR"
            if [ -n "${SPEC_PATH:-}" ] && [ -f "$SPEC_PATH" ]; then
              printf '\n## 기준 스펙 — %s\n\n' "$SPEC_PATH"
              head -c 30000 "$SPEC_PATH"
            fi
            printf '\n\n## DIFF\n\n'
            cat /tmp/diff.patch
          } > /tmp/review-input.txt

          # 역할 지시문은 파일에서 읽는다 — 하네스와 같은 원본을 쓰기 위해서다.
          # --add-dir 은 하위 폴더의 스킬을 세션 스킬 목록에 올린다. 없으면 루트에서 연
          # claude 가 공통 스킬만 잡고, 영역 스킬 25종은 파일을 직접 읽기 전까지 안 보인다.
          claude --add-dir backend --add-dir frontend \
            --output-format text -p "$(cat /tmp/review-role.md)" < /tmp/review-input.txt | tee /tmp/review.md

      - name: 코멘트 게시
        if: env.SKIP != 'true'
        run: |
          if head -n 1 /tmp/review.md | grep -q "PASS"; then
            BADGE="✅ 통과"; VERDICT=PASS
          else
            BADGE="❌ 수정 필요"; VERDICT=CHANGES_REQUESTED
          fi
          # 이번 라운드를 상태에 얹는다. 아직 이 값을 읽어 판단하는 곳은 없다 —
          # ROUNDS 는 여전히 코멘트 개수로 센다. 읽는 쪽을 옮기는 것은 다음 단계다.
          gh pr view "$PR" --json comments --jq '.comments[].body' > /tmp/comments.txt 2>/dev/null || : > /tmp/comments.txt
          bash /tmp/state.sh read < /tmp/comments.txt \
            | bash /tmp/state.sh merge "round=$((ROUNDS + 1))" "verdict=$VERDICT" \
            | bash /tmp/state.sh block > /tmp/state-block.md

          { printf '## %s — %s\n\n%s\n' "$MARKER" "$BADGE" "$(tail -n +2 /tmp/review.md)"
            printf '\n'
            cat /tmp/state-block.md
          } > /tmp/note.md
          gh pr comment "$PR" --body-file /tmp/note.md

      # 판단은 둘 다 /tmp 의 스크립트가 하고, 여기서는 그대로 실행만 한다.
      #   머지할까      → loop-decision.sh  (하네스: common/harness-tests/loop.sh)
      #   다음에 무엇을 → next-role.sh      (하네스: common/harness-tests/next-role.sh)
      # 판단을 이 셸에 되돌려 놓으면 하네스가 루프를 돌려 볼 수 없게 된다.
      - name: 루프 결정과 실행
        if: env.SKIP != 'true'
        run: |
          set -e
          if head -n 1 /tmp/review.md | grep -q "PASS"; then VERDICT=PASS; else VERDICT=CHANGES_REQUESTED; fi

          # 브랜치명 해석은 스크립트가 한다 — 여기서 또 하면 두 곳이 어긋난다
          N=$(HEAD_REF="$HEAD_REF" bash /tmp/loop-decision.sh issue)
          AGENT_MADE=unknown
          if [ -n "$N" ] && LABELS=$(gh issue view "$N" --json labels --jq '.labels[].name' 2>/dev/null); then
            if printf '%s\n' "$LABELS" | grep -qx "claude-made"; then AGENT_MADE=true; else AGENT_MADE=false; fi
          fi

          # 루프 상태에서 실행 횟수를 읽는다. 코멘트는 '코멘트 게시' step 이 이미 받아 뒀다.
          STEP=$(bash /tmp/state.sh read < /tmp/comments.txt | sed -n 's/^step=//p')
          BROKEN=$(bash /tmp/state.sh read < /tmp/comments.txt | sed -n 's/^broken=//p')

          MERGE=$(VERDICT="$VERDICT" HEAD_REF="$HEAD_REF" AGENT_MADE="$AGENT_MADE" \
                    bash /tmp/loop-decision.sh)
          ROLE=$(VERDICT="$VERDICT" ROUNDS="$ROUNDS" MAX_ROUNDS="$MAX_ROUNDS" \
                 STEP="$STEP" MAX_STEPS="$MAX_STEPS" BROKEN="$BROKEN" HAS_PAT="$HAS_PAT" \
                    bash /tmp/next-role.sh 2>/tmp/why.txt)
          echo "머지: $MERGE · 다음 역할: $ROLE (판정=$VERDICT 라벨=$AGENT_MADE 라운드=$ROUNDS/$MAX_ROUNDS 실행=$STEP/$MAX_STEPS)"

          case "$MERGE" in
            merge)
              if gh pr merge "$PR" --squash --delete-branch; then
                echo "자동 머지 완료"
              else
                gh pr comment "$PR" --body "⚠️ 리뷰는 통과했지만 자동 머지에 실패했어요 (충돌 또는 권한 — AGENT_PAT 의 Contents: Read and write 를 확인하세요). 사람이 머지해 주세요."
                echo "자동 머지 실패 — 사람에게 넘김"
              fi
              ;;
            human-merge)
              echo "머지는 사람 몫 (이슈 기반이 아니거나, 사람이 올린 이슈이거나, 판별 불가)"
              ;;
            no-merge) ;;
            *) echo "모르는 머지 결정: $MERGE"; exit 1 ;;
          esac

          case "$ROLE" in
            done)
              echo "더 부를 역할 없음"
              ;;
            human)
              # 멈춘 이유는 규칙이 stderr 로 알려준다 — 여기서 짐작해 지어내지 않는다
              gh pr comment "$PR" --body "⚠️ $(cat /tmp/why.txt) 사람이 확인해 주세요."
              ;;
            loop-off)
              echo "$(cat /tmp/why.txt) (GITHUB_TOKEN 은 다른 워크플로를 깨우지 못한다)"
              ;;
            *)
              gh workflow run claude-agent.yml \
                -f prompt="$(cat /tmp/review.md)" \
                -f node="$ROLE" \
                -f branch="$HEAD_REF" \
                -f issue="$PR" \
                -f context_type="pr"
              echo "재작업 트리거됨 — 역할 $ROLE (라운드 $ROUNDS)"
              ;;
          esac
