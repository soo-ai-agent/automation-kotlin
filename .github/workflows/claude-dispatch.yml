# 🔒 기능 본체 — 여기에 사용자 설정은 없어요. 고칠 곳: 스위치는 .github/agent/settings.env,
#    노드 지시문은 .github/agent/nodes/*.md. 이 파일은 기능 자체를 개조할 때만 열고,
#    수정 전에 common/docs/automation-spec.md 를 먼저 읽어요.
#
# Claude 디스패처 — 라벨이 붙은 열린 이슈를 찾아 일꾼을 착수시키고, 끝난 것을 정리해요.
#
# 실제 로직은 .github/agent/dispatch.py 에 있고, 이 파일은 10분마다 그것을 두 번 부르기만 해요.
#
# 라벨 규약:
#   claude        사람이 붙임 = "이 이슈를 Claude 에게" (착수 동의)
#   claude-split  사람이 붙임 = "이슈를 하위 이슈들로 쪼개 달라" — 분할 노드가 돌고,
#                 만들어진 하위 이슈들(claude 라벨)을 디스패처가 하나씩 착수해요
#   claude-sent   디스패처가 붙임 = 중복 착수 방지 마커. 떼면 재착수돼요.
#   claude-made   분할 노드가 붙임 = 에이전트가 만든 하위 이슈. 자동 머지 대상 판별 키.
#
# 폴링 한 번에 하는 일 (dispatch.py 의 1~6 단계):
#   start   1) claude-split 이슈 → split 노드 착수   2) claude 이슈 → 개발 착수
#   cleanup 3) 분할 상위 이슈: 닫힌 하위를 체크리스트에 체크, 전부 끝나면 결과 보고 (마감은 사람)
#           4) 머지된 PR 의 이슈가 열려 있으면 닫기
#           5) 이슈가 닫힌 열린 PR 닫기(+브랜치)     6) 머지 완료된 claude/* 브랜치 삭제
name: claude-dispatch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT || github.token }}
      HAS_PAT: ${{ secrets.AGENT_PAT != '' }}
      REPO: ${{ github.repository }}
      DEF: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4 # dispatch.py 를 꺼내려고 받아요. 스케줄 실행이라 기본 브랜치가 와요

      - name: 라벨 붙은 이슈 착수 (1·2)
        run: python3 .github/agent/dispatch.py start

      # 착수가 실패해도 정리는 돌아야 해요 — 둘은 서로 의존하지 않아요
      - name: 끝난 이슈·PR·브랜치 정리 (3~6)
        if: always()
        run: python3 .github/agent/dispatch.py cleanup
