# 🔒 기능 본체 — 여기에 사용자 설정은 없어요. 케이스를 늘리려면 common/harness-tests/cases/backend/ 나
#    cases/frontend/ 에 .diff 파일을 더하고, 첫 줄에 `# expect: PASS` 또는 `# expect: CHANGES_REQUESTED` 를 적어요.
#    이 파일은 기능 자체를 개조할 때만 열고, 수정 전에 common/docs/automation-spec.md 를 먼저 읽어요.
#
# 하네스 회귀 테스트 — 규칙 문서를 고친 PR 에서, 리뷰어가 "심어 둔 위반"을 여전히 잡는지 확인해요.
#
# 왜 필요한가: 스킬·리뷰 규칙을 고치면 리뷰어의 판정이 함께 흔들려요. 잡아야 할 위반을 놓치거나
# (case: CHANGES_REQUESTED 기대), 멀쩡한 변경을 막게 되거나(case: PASS 기대) 둘 다 사고예요.
# 규칙을 안 건드린 PR 에서는 돌지 않아요 — 판정 기준이 그대로면 결과도 그대로니까요.
#
# 검사는 셋으로 나뉘어요. 앞의 둘은 모델을 안 부르니 공짜라서 먼저 돌려요.
#   ① static.sh  형식 검사 — 링크·경로·케이스 형식·노드 실행 계약·단계 잡 선언.
#   ② graph.sh   그래프 회귀 — CLAUDE_GRAPH 표현식이 의도한 단계 매트릭스로 펼쳐지는지.
#   ③ loop.sh    루프 회귀 — 리뷰 뒤에 머지할지·재작업할지·사람을 부를지.
#   ④ run.sh     판정 회귀 — 케이스 하나당 claude 호출 1건. 지금 7건(백엔드 5 · 프론트 2)이에요.
#
# CI 는 영역 구분 없이 전부 돌려요 — 손으로 한 영역만 볼 때는 `run.sh backend` 처럼 영역을 붙여요.
name: claude-harness

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/.claude/skills/**"
      - "common/docs/code-review/rules.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "common/harness-tests/**"
      # 리뷰어의 역할 지시문과 통과 기준도 판정 기준이다 — 고치면 판정이 흔들린다
      - ".github/agent/review-role.md"
      - ".github/agent/settings.env"
      # 노드의 실행 계약(allowed-tools)과 그것을 적용하는 실행기도 규칙이다 —
      # 계약이 빠지면 그 노드는 읽기 전용 git 만 받고, 지시문과 권한이 어긋난 채 돈다.
      # 형식 검사(①)가 이 어긋남을 잡으므로 여기 두 경로가 목록에 있어야 한다.
      - ".github/agent/nodes/**"
      - ".github/agent/run-claude.sh"
      # 그래프를 펼치는 도구와 그것이 채우는 단계 잡 — 그래프 회귀(②)가 이 둘을 잰다
      - ".github/agent/graph.js"
      - ".github/workflows/claude-agent.yml"
      # 루프 판단(자동 머지 게이트 포함)과 그것을 실행하는 리뷰어 — 루프 회귀(③)가 잰다
      - ".github/agent/loop-decision.sh"
      - ".github/workflows/claude-review.yml"

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # PR 브랜치의 규칙으로 돌려요 — claude-review.yml 이 기준 브랜치 설정을 쓰는 것과 반대예요.
      # 저기서는 PR 이 자기 리뷰 기준을 바꾸는 것을 막아야 하지만,
      # 여기서는 "이 PR 이 바꾼 규칙"이 검사 대상이라 PR 것을 그대로 읽어야 해요.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # 모델을 안 부르는 검사부터 — 여기서 깨지면 claude 를 한 번도 안 부르고 끝나요.
      - name: 형식 검사
        run: bash common/harness-tests/static.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 그래프 회귀도 모델을 안 부른다 — graph.js 를 그대로 돌려 매트릭스를 대조한다.
      - name: 그래프 회귀
        run: bash common/harness-tests/graph.sh

      # 루프 회귀도 모델을 안 부른다 — 자동 머지 게이트를 포함한 판단을 상황별로 잰다.
      - name: 루프 회귀
        run: bash common/harness-tests/loop.sh

      - name: claude CLI 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: 판정 회귀
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # run.sh 는 FAIL 이 하나라도 있으면 0 이 아닌 코드로 끝나요 — 그대로 잡 실패가 되어 머지를 막아요.
        run: bash common/harness-tests/run.sh
