# 프론트엔드 PR 검사 — 타입·번들·E2E 를 한 번에 본다.
#
# 왜 필요한가: deploy.yml 은 main push 에서만 돌고 테스트를 건너뛴다(`-x test`).
# 이 파일이 없으면 PR 에서 아무 검사도 돌지 않아, E2E 를 써 놓고도 아무도 돌리지 않게 된다.
#
# 비용: PR 당 2~3분. frontend/ 를 건드린 PR 에서만 돈다.
name: frontend-check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-check.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      # E2E 를 먼저 돌린다 — Metro 개발 서버가 뜨면서 .expo/types 의 라우트 타입이 생성되고,
      # 그래야 뒤따르는 tsc 가 `<Link href>` 오타까지 잡는다(app.json experiments.typedRoutes).
      - name: 린트 (Expo 공식 규칙 + 포맷)
        run: npm run lint

      - name: E2E (Playwright)
        run: npm run e2e

      - name: 타입 검사 + 웹 번들
        run: npm run build
